<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline';" />
  <title>Lock with LocalVault</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      overflow: hidden;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 28px 28px 24px;
      width: 360px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }

    .header { display: flex; align-items: center; gap: 12px; }

    .icon {
      width: 40px; height: 40px;
      background: #f59e0b18;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .icon svg { width: 20px; height: 20px; stroke: #fbbf24; }

    .title { font-size: 15px; font-weight: 600; color: #f1f5f9; line-height: 1.3; }
    .subtitle { font-size: 11px; color: #64748b; margin-top: 2px; }
    .filename {
      font-size: 11px; color: #94a3b8;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 220px; margin-top: 2px;
    }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 12px; color: #94a3b8; font-weight: 500; }

    .input-wrap { position: relative; }
    input[type="password"], input[type="text"] {
      width: 100%;
      background: #0f172a;
      border: 1.5px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 14px;
      padding: 10px 42px 10px 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #f59e0b; }

    .toggle-vis {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: #475569;
      display: flex; align-items: center; padding: 2px;
    }
    .toggle-vis:hover { color: #94a3b8; }
    .toggle-vis svg { width: 16px; height: 16px; }

    .warning {
      display: flex; align-items: flex-start; gap: 8px;
      background: #f59e0b10; border: 1px solid #f59e0b30;
      border-radius: 8px; padding: 10px 12px; font-size: 12px; color: #fbbf24;
    }
    .warning svg { width: 14px; height: 14px; stroke: #fbbf24; flex-shrink: 0; margin-top: 1px; }

    .error {
      font-size: 12px; color: #f87171; display: none;
      padding: 8px 10px; background: #f8717115;
      border-radius: 6px; border: 1px solid #f8717130;
    }
    .error.visible { display: block; }

    .actions { display: flex; gap: 10px; }

    .btn {
      flex: 1; padding: 10px; border-radius: 8px; border: none;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }

    .btn-cancel {
      background: #1e293b; border: 1.5px solid #334155; color: #94a3b8;
    }
    .btn-cancel:hover { background: #263347; }

    .btn-lock { background: #d97706; color: #fff; }
    .btn-lock:hover { background: #b45309; }
    .btn-lock:disabled { opacity: 0.5; cursor: default; }

    .spinner {
      display: inline-block; width: 13px; height: 13px;
      border: 2px solid #ffffff40; border-top-color: #fff;
      border-radius: 50%; animation: spin 0.6s linear infinite;
      margin-right: 6px; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .success {
      text-align: center; color: #34d399; font-size: 13px; font-weight: 500;
      display: none; align-items: center; justify-content: center; gap: 6px;
    }
    .success.visible { display: flex; }
    .success svg { width: 16px; height: 16px; stroke: #34d399; }
  </style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <div>
      <div class="title">Lock with LocalVault</div>
      <div class="filename" id="fname">—</div>
    </div>
  </div>

  <div class="warning">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
    <span>The original file will be replaced with an encrypted <strong>.lvlock</strong> file. Keep your password safe — without it, the file cannot be recovered.</span>
  </div>

  <div class="field">
    <label for="pass">Reveal Password</label>
    <div class="input-wrap">
      <input type="password" id="pass" placeholder="Enter your reveal password" autocomplete="off" />
      <button class="toggle-vis" id="toggleVis" tabindex="-1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="error" id="err"></div>

  <div class="success" id="successMsg">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    File locked! Closing…
  </div>

  <div class="actions" id="actionBtns">
    <button class="btn btn-cancel" id="btnCancel">Cancel</button>
    <button class="btn btn-lock" id="btnLock">🔒 Lock File</button>
  </div>
</div>

<script>
  const passEl     = document.getElementById('pass');
  const errEl      = document.getElementById('err');
  const fnameEl    = document.getElementById('fname');
  const btnLock    = document.getElementById('btnLock');
  const btnCancel  = document.getElementById('btnCancel');
  const successMsg = document.getElementById('successMsg');
  const actionBtns = document.getElementById('actionBtns');
  const toggleVis  = document.getElementById('toggleVis');

  window.lockApi.getTargetPath().then((targetPath) => {
    if (!targetPath) {
      errEl.textContent = 'No file path received.';
      errEl.classList.add('visible');
      return;
    }
    const name = targetPath.replace(/\\/g, '/').split('/').pop();
    fnameEl.textContent = name;
    fnameEl.title = targetPath;
  });

  // Toggle password visibility
  let visible = false;
  toggleVis.addEventListener('click', () => {
    visible = !visible;
    passEl.type = visible ? 'text' : 'password';
    toggleVis.innerHTML = visible
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/></svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
  });

  btnCancel.addEventListener('click', () => window.lockApi.cancel());
  passEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') btnLock.click(); });

  btnLock.addEventListener('click', async () => {
    const pass = passEl.value.trim();
    if (!pass) {
      errEl.textContent = 'Please enter your reveal password.';
      errEl.classList.add('visible');
      passEl.focus();
      return;
    }

    errEl.classList.remove('visible');
    btnLock.disabled = true;
    btnLock.innerHTML = '<span class="spinner"></span>Locking…';

    const result = await window.lockApi.lock(pass);

    if (result.ok) {
      actionBtns.style.display = 'none';
      successMsg.classList.add('visible');
      setTimeout(() => window.lockApi.done(), 1200);
    } else {
      errEl.textContent = result.error || 'Failed to lock file.';
      errEl.classList.add('visible');
      btnLock.disabled = false;
      btnLock.textContent = '🔒 Lock File';
      passEl.select();
      passEl.focus();
    }
  });

  passEl.focus();
</script>
</body>
</html>
