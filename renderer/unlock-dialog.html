<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline';" />
  <title>Unlock File</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      overflow: hidden;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 28px 28px 24px;
      width: 340px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon {
      width: 38px;
      height: 38px;
      background: #1d4ed820;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon svg { width: 20px; height: 20px; stroke: #60a5fa; }

    .title { font-size: 15px; font-weight: 600; color: #f1f5f9; line-height: 1.3; }
    .filename {
      font-size: 11px;
      color: #64748b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 12px; color: #94a3b8; font-weight: 500; }

    .input-wrap { position: relative; }
    input[type="password"] {
      width: 100%;
      background: #0f172a;
      border: 1.5px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 14px;
      padding: 10px 42px 10px 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="password"]:focus { border-color: #3b82f6; }

    .toggle-vis {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #475569;
      display: flex;
      align-items: center;
      padding: 2px;
    }
    .toggle-vis:hover { color: #94a3b8; }
    .toggle-vis svg { width: 16px; height: 16px; }

    .error {
      font-size: 12px;
      color: #f87171;
      display: none;
      padding: 8px 10px;
      background: #f8717115;
      border-radius: 6px;
      border: 1px solid #f8717130;
    }
    .error.visible { display: block; }

    .actions { display: flex; gap: 10px; }

    .btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }

    .btn-cancel {
      background: #1e293b;
      border: 1.5px solid #334155;
      color: #94a3b8;
    }
    .btn-cancel:hover { background: #263347; }

    .btn-unlock {
      background: #2563eb;
      color: #fff;
    }
    .btn-unlock:hover { background: #1d4ed8; }
    .btn-unlock:disabled { opacity: 0.5; cursor: default; }

    .spinner {
      display: inline-block;
      width: 13px;
      height: 13px;
      border: 2px solid #ffffff40;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .success {
      text-align: center;
      color: #34d399;
      font-size: 13px;
      font-weight: 500;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .success.visible { display: flex; }
    .success svg { width: 16px; height: 16px; stroke: #34d399; }
  </style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <div>
      <div class="title">Unlock File</div>
      <div class="filename" id="fname">—</div>
    </div>
  </div>

  <div class="field">
    <label for="pass">Password</label>
    <div class="input-wrap">
      <input type="password" id="pass" placeholder="Enter reveal password" autocomplete="off" />
      <button class="toggle-vis" id="toggleVis" tabindex="-1">
        <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="error" id="err"></div>

  <div class="success" id="successMsg">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    File unlocked! Closing…
  </div>

  <div class="actions" id="actionBtns">
    <button class="btn btn-cancel" id="btnCancel">Cancel</button>
    <button class="btn btn-unlock" id="btnUnlock">Unlock</button>
  </div>
</div>

<script>
  const passEl = document.getElementById('pass');
  const errEl  = document.getElementById('err');
  const fnameEl = document.getElementById('fname');
  const btnUnlock = document.getElementById('btnUnlock');
  const btnCancel = document.getElementById('btnCancel');
  const successMsg = document.getElementById('successMsg');
  const actionBtns = document.getElementById('actionBtns');
  const toggleVis  = document.getElementById('toggleVis');

  // Get lock file path from main process
  window.unlockApi.getLockPath().then((lockPath) => {
    if (!lockPath) {
      errEl.textContent = 'No file path received.';
      errEl.classList.add('visible');
      return;
    }
    // Show just the filename (strip long path)
    const name = lockPath.replace(/\\/g, '/').split('/').pop();
    fnameEl.textContent = name;
    fnameEl.title = lockPath;
  });

  // Toggle password visibility
  toggleVis.addEventListener('click', () => {
    if (passEl.type === 'password') {
      passEl.type = 'text';
      toggleVis.innerHTML = `<svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/></svg>`;
    } else {
      passEl.type = 'password';
      toggleVis.innerHTML = `<svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
    }
  });

  btnCancel.addEventListener('click', () => window.unlockApi.cancel());

  passEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') btnUnlock.click();
  });

  btnUnlock.addEventListener('click', async () => {
    const pass = passEl.value.trim();
    if (!pass) {
      errEl.textContent = 'Please enter a password.';
      errEl.classList.add('visible');
      passEl.focus();
      return;
    }

    errEl.classList.remove('visible');
    btnUnlock.disabled = true;
    btnUnlock.innerHTML = '<span class="spinner"></span>Unlocking…';

    const result = await window.unlockApi.unlock(pass);

    if (result.ok) {
      actionBtns.style.display = 'none';
      successMsg.classList.add('visible');
      setTimeout(() => window.unlockApi.done(), 1200);
    } else {
      errEl.textContent = result.error || 'Wrong password or corrupted file.';
      errEl.classList.add('visible');
      btnUnlock.disabled = false;
      btnUnlock.textContent = 'Unlock';
      passEl.select();
      passEl.focus();
    }
  });

  // Auto-focus password input
  passEl.focus();
</script>
</body>
</html>
